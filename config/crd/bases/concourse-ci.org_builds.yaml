---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: builds.concourse-ci.org
spec:
  group: concourse-ci.org
  names:
    categories:
    - concourse
    kind: Build
    listKind: BuildList
    plural: builds
    shortNames:
    - ccb
    singular: build
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.jobRef.name
      name: Job
      type: string
    - jsonPath: .status.buildID
      name: BuildID
      type: integer
    - jsonPath: .status.concourseStatus
      name: Status
      type: string
    - jsonPath: .status.conditions[?(@.type=="Complete")].status
      name: Complete
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      priority: 1
      type: string
    - jsonPath: .status.duration
      name: Duration
      priority: 1
      type: string
    - jsonPath: .status.webURL
      name: WebURL
      priority: 1
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      priority: 1
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Build tracks and optionally triggers a build in Concourse.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BuildSpec defines the desired state of Build.
              Creating a Build with no BuildID triggers a new Concourse build once.
              Setting BuildID adopts and watches an existing Concourse build.
              Setting RerunOf creates a new build that reruns a previous build.
            properties:
              buildID:
                description: BuildID adopts an existing Concourse build instead of
                  creating a new one.
                format: int32
                minimum: 1
                type: integer
              canceled:
                description: |-
                  Canceled requests abort of a non-terminal build. Ignored once the build
                  has reached a terminal state.
                type: boolean
              comment:
                description: |-
                  Comment sets a comment on the build once it exists. Reconciled
                  idempotently: only applied when it differs from the last comment
                  recorded in status.
                maxLength: 1024
                type: string
              jobRef:
                description: JobRef references the Job that this build belongs to.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the referent. Empty means the same namespace
                      as the referring object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              rerunOf:
                description: |-
                  RerunOf is the build NAME/number (e.g. "42") of a previous build to
                  rerun. When set, the controller creates a new build as a rerun of the
                  referenced build instead of triggering a fresh one. Mutually exclusive
                  with BuildID.
                type: string
              suspend:
                default: false
                description: |-
                  Suspend stops all reconciliation activity on this Build.
                  Existing Concourse state is left untouched.
                type: boolean
              ttlSecondsAfterFinished:
                description: |-
                  TTLSecondsAfterFinished is how long to keep this Build after it reaches a
                  terminal state. Zero or unset means keep until history limits prune it.
                format: int32
                minimum: 0
                type: integer
            type: object
            x-kubernetes-validations:
            - message: jobRef is required
              rule: has(self.jobRef)
            - message: rerunOf and buildID are mutually exclusive
              rule: '!(has(self.rerunOf) && has(self.buildID))'
          status:
            description: BuildStatus defines the observed state of Build.
            properties:
              apiURL:
                description: APIURL is the Concourse API path for this build.
                type: string
              buildID:
                description: BuildID is the numeric Concourse build ID.
                format: int32
                type: integer
              buildName:
                description: BuildName is the display name of the build (e.g. "42").
                type: string
              comment:
                description: Comment is the comment last applied by the operator to
                  this build.
                type: string
              concourseStatus:
                description: ConcourseStatus reflects the current Concourse build
                  status.
                enum:
                - pending
                - started
                - succeeded
                - failed
                - errored
                - aborted
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              createdBy:
                description: CreatedBy is the user or system that triggered the build.
                type: string
              duration:
                description: Duration is the elapsed time between StartTime and EndTime.
                type: string
              endTime:
                description: EndTime is when the build completed.
                format: date-time
                type: string
              inputs:
                description: Inputs lists the input resource versions used in this
                  build.
                items:
                  description: BuildIO represents an input or output resource version
                    used in a build.
                  properties:
                    firstOccurrence:
                      description: FirstOccurrence indicates whether this build is
                        the first time this version ran in the pipeline.
                      type: boolean
                    name:
                      description: Name of the input or output resource.
                      type: string
                    version:
                      additionalProperties:
                        type: string
                      description: Version of the resource.
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the last generation that was reconciled.
                format: int64
                type: integer
              outputs:
                description: Outputs lists the output resource versions produced by
                  this build.
                items:
                  description: BuildIO represents an input or output resource version
                    used in a build.
                  properties:
                    firstOccurrence:
                      description: FirstOccurrence indicates whether this build is
                        the first time this version ran in the pipeline.
                      type: boolean
                    name:
                      description: Name of the input or output resource.
                      type: string
                    version:
                      additionalProperties:
                        type: string
                      description: Version of the resource.
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              rerunOf:
                description: RerunOf reflects the build name/number this build was
                  a rerun of, if any.
                type: string
              startTime:
                description: StartTime is when the build started.
                format: date-time
                type: string
              webURL:
                description: WebURL is the Concourse UI URL for this build.
                format: uri
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
