---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: workers.concourse-ci.org
spec:
  group: concourse-ci.org
  names:
    categories:
    - concourse
    kind: Worker
    listKind: WorkerList
    plural: workers
    shortNames:
    - ccw
    singular: worker
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.instanceRef.name
      name: Instance
      type: string
    - jsonPath: .status.resolvedName
      name: Worker
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.platform
      name: Platform
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .status.activeTasks
      name: Tasks
      priority: 1
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Stalled")].status
      name: Stalled
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      priority: 1
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Worker observes and manages a worker in a Concourse instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkerSpec defines the desired state of Worker.
            properties:
              instanceRef:
                description: InstanceRef references the Instance this worker belongs
                  to.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the referent. Empty means the same namespace
                      as the referring object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              lifecycle:
                default: Running
                description: |-
                  Lifecycle is the desired worker lifecycle.
                  - Running: leave the worker in the pool (default)
                  - Draining: land the worker (graceful drain)
                  - Removed: prune the worker from the pool
                enum:
                - Running
                - Draining
                - Removed
                type: string
              suspend:
                default: false
                description: |-
                  Suspend stops all reconciliation activity on this Worker.
                  Existing Concourse state is left untouched.
                type: boolean
              workerName:
                description: |-
                  WorkerName is the unique name of the worker in Concourse.
                  Defaults to metadata.name.
                maxLength: 100
                minLength: 1
                type: string
            required:
            - instanceRef
            type: object
            x-kubernetes-validations:
            - message: workerName is immutable
              rule: '!has(oldSelf.workerName) || self.workerName == oldSelf.workerName'
            - message: instanceRef is immutable
              rule: self.instanceRef == oldSelf.instanceRef
          status:
            description: WorkerStatus defines the observed state of Worker.
            properties:
              activeContainers:
                description: ActiveContainers is the number of containers running
                  on the worker.
                format: int32
                type: integer
              activeTasks:
                description: ActiveTasks is the number of active tasks running on
                  this worker.
                format: int32
                type: integer
              activeVolumes:
                description: ActiveVolumes is the number of volumes on the worker.
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              ephemeral:
                description: Ephemeral indicates whether the worker is ephemeral (auto-removed
                  on disconnect).
                type: boolean
              observedGeneration:
                description: ObservedGeneration is the last generation that was reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the current state of the worker as reported
                  by Concourse.
                enum:
                - running
                - landing
                - landed
                - retiring
                - stalled
                - missing
                type: string
              platform:
                description: Platform is the worker platform (e.g. linux, darwin).
                type: string
              resolvedName:
                description: ResolvedName is the Concourse worker name after defaulting.
                type: string
              resourceTypes:
                description: ResourceTypes is the list of custom resource types supported
                  by this worker.
                items:
                  description: WorkerResourceTypeStatus represents an advertised custom
                    resource type version on the worker.
                  properties:
                    privileged:
                      description: Privileged indicates whether this custom resource
                        type requires privileged containers.
                      type: boolean
                    type:
                      description: Type of the custom resource type.
                      type: string
                    version:
                      description: Version of the custom resource type.
                      type: string
                  required:
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              startTime:
                description: StartTime is when the worker registered with Concourse.
                format: date-time
                type: string
              tags:
                description: Tags are the worker tags.
                items:
                  type: string
                type: array
              team:
                description: Team is the Concourse team this worker is scoped to;
                  empty means global worker.
                type: string
              version:
                description: Version is the worker binary version.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
