---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: teams.concourse-ci.org
spec:
  group: concourse-ci.org
  names:
    categories:
    - concourse
    kind: Team
    listKind: TeamList
    plural: teams
    shortNames:
    - cct
    singular: team
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.instanceRef.name
      name: Instance
      type: string
    - jsonPath: .status.resolvedName
      name: Team
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.teamID
      name: ID
      priority: 1
      type: integer
    - jsonPath: .status.webURL
      name: WebURL
      priority: 1
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      priority: 1
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Team manages a Concourse team and its auth configuration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TeamSpec defines the desired state of Team.
            properties:
              allowDestroy:
                description: |-
                  AllowDestroy permits deleting the reserved Concourse "main" team.
                  Defaults to false. Destroying main is almost always a mistake.
                type: boolean
              instanceRef:
                description: InstanceRef references the Instance this team belongs
                  to.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the referent. Empty means the same namespace
                      as the referring object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              reclaimPolicy:
                default: Delete
                description: |-
                  ReclaimPolicy controls whether the Concourse team is deleted when this
                  CR is removed. Defaults to Delete.
                enum:
                - Delete
                - Orphan
                type: string
              roles:
                description: Roles defines auth role bindings for the team.
                items:
                  description: TeamRole defines a role binding within a Concourse
                    team.
                  properties:
                    groups:
                      description: Groups is a list of group identifiers (provider:group).
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    role:
                      description: Role is the Concourse role name (owner, member,
                        pipeline-operator, viewer).
                      enum:
                      - owner
                      - member
                      - pipeline-operator
                      - viewer
                      type: string
                    users:
                      description: Users is a list of user identifiers (provider:username).
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - role
                  type: object
                  x-kubernetes-validations:
                  - message: each role must have at least one user or group
                    rule: size(self.users) > 0 || size(self.groups) > 0
                type: array
                x-kubernetes-list-map-keys:
                - role
                x-kubernetes-list-type: map
              suspend:
                default: false
                description: |-
                  Suspend stops all reconciliation activity on this Team.
                  Existing Concourse state is left untouched.
                type: boolean
              teamName:
                description: TeamName is the team name in Concourse. Defaults to metadata.name.
                maxLength: 100
                minLength: 1
                pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
                type: string
            required:
            - instanceRef
            type: object
            x-kubernetes-validations:
            - message: teamName is immutable
              rule: '!has(oldSelf.teamName) || self.teamName == oldSelf.teamName'
            - message: instanceRef is immutable
              rule: self.instanceRef == oldSelf.instanceRef
          status:
            description: TeamStatus defines the observed state of Team.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastApplied:
                description: LastApplied is the timestamp of the last successful CreateOrUpdate.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation that was reconciled.
                format: int64
                type: integer
              resolvedName:
                description: ResolvedName is the Concourse team name after defaulting.
                type: string
              teamID:
                description: TeamID is the Concourse-assigned numeric team ID.
                format: int32
                type: integer
              webURL:
                description: WebURL is the Concourse UI URL for this team.
                format: uri
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
