# This rule is not used by the project concourse-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the concourse.concourse-ci.org.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: concourse-operator
    app.kubernetes.io/managed-by: kustomize
  name: concoursejob-editor-role
rules:
- apiGroups:
  - concourse.concourse-ci.org
  resources:
  - concoursejobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - concourse.concourse-ci.org
  resources:
  - concoursejobs/status
  verbs:
  - get
