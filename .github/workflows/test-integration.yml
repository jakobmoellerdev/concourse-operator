name: Integration Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-integration:
    permissions:
      contents: read
    name: Run against Concourse CI
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Start Concourse CI
        run: docker compose up -d

      - name: Wait for Concourse to be healthy
        run: |
          echo "Waiting for Concourse web to accept connections..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/api/v1/info; do sleep 3; done'
          echo ""
          echo "Concourse is ready."

      - name: Run integration tests
        run: make test-integration
