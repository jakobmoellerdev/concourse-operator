name: Integration Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-integration:
    permissions:
      contents: read
    name: Run against Concourse CI
    runs-on: ubuntu-latest

    services:
      concourse-db:
        image: postgres
        env:
          POSTGRES_DB: concourse
          POSTGRES_PASSWORD: concourse_pass
          POSTGRES_USER: concourse_user
          PGDATA: /database
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U concourse_user -d concourse"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Start Concourse CI
        run: |
          docker run -d --name concourse \
            --privileged \
            --cgroupns=host \
            --network host \
            -e CONCOURSE_POSTGRES_HOST=localhost \
            -e CONCOURSE_POSTGRES_USER=concourse_user \
            -e CONCOURSE_POSTGRES_PASSWORD=concourse_pass \
            -e CONCOURSE_POSTGRES_DATABASE=concourse \
            -e CONCOURSE_EXTERNAL_URL=http://localhost:8080 \
            -e CONCOURSE_ADD_LOCAL_USER=test:test \
            -e CONCOURSE_MAIN_TEAM_LOCAL_USER=test \
            -e CONCOURSE_WORKER_BAGGAGECLAIM_DRIVER=overlay \
            -e CONCOURSE_CLIENT_SECRET=Y29uY291cnNlLXdlYgo= \
            -e CONCOURSE_TSA_CLIENT_SECRET=Y29uY291cnNlLXdvcmtlcgo= \
            -e CONCOURSE_CLUSTER_NAME=tutorial \
            -e CONCOURSE_WORKER_CONTAINERD_DNS_SERVER=8.8.8.8 \
            -e CONCOURSE_WORKER_RUNTIME=containerd \
            -e CONCOURSE_ENABLE_PIPELINE_INSTANCES=true \
            -e CONCOURSE_ENABLE_ACROSS_STEP=true \
            -e CONCOURSE_ENABLE_RESOURCE_CAUSALITY=true \
            concourse/concourse quickstart

      - name: Wait for Concourse to be healthy
        run: |
          echo "Waiting for Concourse web to accept connections..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/api/v1/info; do sleep 3; done'
          echo ""
          echo "Concourse is ready."

      - name: Run integration tests
        run: make test-integration
