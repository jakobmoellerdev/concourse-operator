name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  test-integration:
    permissions:
      contents: read
    name: Run against Concourse CI
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache Docker images
        id: docker-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/docker-cache
          key: docker-${{ hashFiles('docker-compose.yml') }}

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/docker-cache/concourse.tar
          docker load -i /tmp/docker-cache/postgres.tar

      - name: Start Concourse CI
        run: docker compose up -d

      - name: Save Docker images to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-cache
          docker save concourse/concourse -o /tmp/docker-cache/concourse.tar
          docker save postgres -o /tmp/docker-cache/postgres.tar

      - name: Wait for Concourse to be healthy
        run: |
          echo "Waiting for Concourse web to accept connections..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/api/v1/info; do sleep 3; done'
          echo ""
          echo "Concourse is ready."

      - name: Setup envtest binaries
        run: make setup-envtest

      - name: Run integration tests
        run: make test-integration
