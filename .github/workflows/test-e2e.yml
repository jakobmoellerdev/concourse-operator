name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

env:
  KIND_VERSION: v0.27.0
  MANAGER_IMAGE: example.com/concourse-operator:v0.0.1
  KIND_CLUSTER: concourse-operator-test-e2e

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache kind binary
        id: cache-kind
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/kind
          key: kind-${{ env.KIND_VERSION }}-linux-${{ runner.arch }}

      - name: Install kind ${{ env.KIND_VERSION }}
        if: steps.cache-kind.outputs.cache-hit != 'true'
        run: |
          arch=$(go env GOARCH)
          curl -Lo /tmp/kind "https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-${arch}"
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Generate manifests and code
        run: make manifests generate fmt vet

      - name: Build manager image (cached)
        run: |
          docker build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "$MANAGER_IMAGE" .
        env:
          DOCKER_BUILDKIT: "1"

      - name: Create Kind cluster
        run: kind create cluster --name "$KIND_CLUSTER"

      - name: Load manager image into Kind
        run: kind load docker-image "$MANAGER_IMAGE" --name "$KIND_CLUSTER"

      - name: Run e2e tests
        run: |
          KIND=$(which kind) KIND_CLUSTER="$KIND_CLUSTER" \
          CERT_MANAGER_INSTALL_SKIP=true \
          go test -tags=e2e ./test/e2e/ -v -ginkgo.v

      - name: Cleanup Kind cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER"
