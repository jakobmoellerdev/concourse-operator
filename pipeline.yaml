apiVersion: concourse-ci.org/v1alpha1
kind: Pipeline
metadata:
  name: hello-world
spec:
  teamRef:
    name: my-team
  pipelineName: hello-world
  config:
    inline: |
      jobs:
        - name: hello
          plan:
            - task: say-hello
              config:
                platform: linux
                image_resource:
                  type: registry-image
                  source: { repository: alpine }
                run:
                  path: echo
                  args: ["Hello from concourse-operator!"]
  paused: false
  exposed: true
